packages:
  - packages/*
allowBuilds:
  # Squirrel.Windows 安装器的依赖；Diffra 只打 NSIS 包，不需要它的安装脚本。
  electron-winstaller: false
  # 底部终端用的伪终端；安装脚本优先用包里自带的预编译文件（N-API，Electron 也能直接用）
  node-pty: true
  # 静态检查用的 Python 语法；包里带了各平台的预编译解析器，运行时直接加载，不需要安装脚本去本机编译
  '@ast-grep/lang-python': false
  # 架构分析用的 Go、Rust、Java 语法，和 Python 一样带预编译解析器
  '@ast-grep/lang-go': false
  '@ast-grep/lang-rust': false
  '@ast-grep/lang-java': false
  # 设计页 PDF 导出（jspdf → canvg）带进来的；安装脚本只打印捐助横幅
  core-js: false
packageExtensions:
  # 模型匹配表会经品牌入口间接导入 Avatar 和 Combine，它们依赖 @lobehub/ui；这里标成可选 peer 不安装，构建时用 alias 指到 lib/lobe-ui-shim.tsx（见 docs/decisions.md）
  '@lobehub/icons':
    peerDependenciesMeta:
      '@lobehub/ui':
        optional: true
