# relay.diffra.dev 的 80 端口：给 Let's Encrypt 验证域名，其余跳到 HTTPS。
# 第一次上线先只放这一段、申请证书，再在后面接上 nginx-https.conf（见 docs/decisions.md「设备连接」的首次上线）
server {
    listen 80;
    listen [::]:80;
    server_name relay.diffra.dev;

    # 中转的日志都在 /var/log/diffra-relay/ 下，留 14 天（logrotate.conf）；不放 /var/log/nginx/，那里按官网的规则留 180 天
    access_log /var/log/diffra-relay/nginx-access.log;
    error_log /var/log/diffra-relay/nginx-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
