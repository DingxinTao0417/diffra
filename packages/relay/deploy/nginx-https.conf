# relay.diffra.dev 的 HTTPS：终止 TLS，把 WebSocket（/v1）和健康检查（/health）转给本机的中转进程。
# 接在 nginx-http.conf 后面放进 /etc/nginx/sites-available/relay.diffra.dev。证书由 certbot 定时续期
limit_conn_zone $binary_remote_addr zone=relay_conn:10m;
limit_req_zone $binary_remote_addr zone=relay_req:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name relay.diffra.dev;
    server_tokens off;

    # 和官网、更新源一样用 certbot 生成的 TLS 设置
    ssl_certificate /etc/letsencrypt/live/relay.diffra.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.diffra.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/diffra-relay/nginx-access.log;
    error_log /var/log/diffra-relay/nginx-error.log warn;
    client_max_body_size 1k;

    location = /v1 {
        # 和中转进程里的上限一致：同一个 IP 同时最多 10 条；重连太频繁的直接拒（每秒 10 次，突发 20）
        limit_conn relay_conn 10;
        limit_req zone=relay_req burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 中转每 25 秒发一次心跳，留足余量
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
