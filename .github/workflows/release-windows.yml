name: Windows 构建

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # 建草稿 Release、上传安装包要写权限
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # 更新日志按 tag 分版本、从提交信息生成，要完整历史和全部 tag
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tag 和 desktop 的 version 不一致会发出版本号错乱的更新包
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./packages/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME 与 packages/desktop/package.json 的 version $version 不一致"
            exit 1
          fi

      # 这一版至少要有一条 feat 或 fix 提交，不然更新日志是空的
      - name: 检查更新日志
        if: startsWith(github.ref, 'refs/tags/v')
        run: node packages/desktop/scripts/changelog.ts --check

      - run: pnpm --filter @diffra/desktop exec install-electron

      # 浏览器扩展的 e2e 要用 Playwright 的 Chromium 加载扩展（正式版 Chrome 不让命令行加载）
      - run: pnpm --filter @diffra/desktop exec playwright install chromium

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm --filter @diffra/desktop package

      # 安装包放进 v<版本号> 的草稿 Release：仓库私有，只有有权限的人能下载；不占 Actions 的产物存储配额
      # （之前用 upload-artifact，配额满了以后上传直接失败）。同名 Release 已存在时覆盖里面的文件。
      # 正式发布以更新源上的文件为准
      - name: 上传到草稿 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/desktop/package.json').version")
          tag="v$version"
          files=(
            "packages/desktop/release/Diffra-Setup-$version.exe"
            "packages/desktop/release/Diffra-Setup-$version.exe.blockmap"
            "packages/desktop/release/latest.yml"
          )
          # 说明用这一版的更新日志
          node packages/desktop/scripts/changelog.ts --notes release-notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" "${files[@]}" --draft --target "$GITHUB_SHA" --title "Diffra $version" --notes-file release-notes.md
          fi
