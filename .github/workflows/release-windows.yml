name: Windows 构建

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tag 和 desktop 的 version 不一致会发出版本号错乱的更新包
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./packages/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME 与 packages/desktop/package.json 的 version $version 不一致"
            exit 1
          fi

      - run: pnpm --filter @diffra/desktop exec install-electron

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm --filter @diffra/desktop package

      - uses: actions/upload-artifact@v7
        with:
          name: diffra-windows
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest.yml
          if-no-files-found: error
          # 每次约 116MB，会占账号的 Actions 存储配额；正式产物以更新源上的为准
          retention-days: 7
